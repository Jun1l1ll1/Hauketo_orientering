<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Hauketo orientering</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <button class="leave_btn" onclick="exit('admincode')">Logg ut</button>

    <button class="back_btn" onclick="home()">< Til start</button>
    
    <div class="center_vertical">
        <div class="admin_cont">

            <div class="container" style="margin-top: 40px;">
                <h4>Resultater</h4>
                <button id="download_result_groups">Last ned gruppe-data</button>
                <button id="download_result_individual">Last ned individ-data</button>
            </div>

            <div class="center" style="margin-bottom: 40px;">
                <a href="./admview.html" class="btn big_confirm_btn">Se oversikt over grupper og poster</a>
            </div>

            <div class="container flex_space_between">
                <h4>Grupper</h4>
                <a href="./admedit.html?edit=groups" class="btn edit_btn">Rediger</a>
            </div>

            <div class="container flex_space_between">
                <h4>Poster</h4>
                <a href="./admedit.html?edit=posts" class="btn edit_btn">Rediger</a>
            </div>

            <div class="container">
                <p>Bytt adminkode: Kontakt utvikler direkte, eller via Silje C. Heggelund</p>
            </div>

        </div>
    </div>

    <!-- Data is added here with setExportDataGroups() and setExportDataIndividual() so it can be exported and downloaded as an excel file -->
    <table class="hide" id="result_group_export_table"></table>
    <table class="hide" id="result_individual_export_table"></table>
    
</body>
<script src="script.js"></script>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
    document.getElementById("download_result_groups").addEventListener('click', function() {
        var wb = XLSX.utils.table_to_book(document.getElementById("result_group_export_table"));
        XLSX.writeFile(wb, "Orientering - Resulatater Gruppe.xlsx");
    });

    document.getElementById("download_result_individual").addEventListener('click', function() {
        var wb = XLSX.utils.table_to_book(document.getElementById("result_individual_export_table"));
        XLSX.writeFile(wb, "Orientering - Resulatater Individ.xlsx");
    });
</script>

<script type="module">
    import { verifyACode, setExportDataGroups, setExportDataIndividual } from "./db.js";

    const acode = get_cookie("admincode");

    const correct = await verifyACode(acode);
    if (!correct) {
        exit("admincode");
    }

    setExportDataGroups();
    setExportDataIndividual();
</script>
</html>
